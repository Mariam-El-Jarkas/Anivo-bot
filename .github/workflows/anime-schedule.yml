name: ANIVO - Anime schedule

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      day:
        description: "Optional day (Monday-Sunday)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send anime schedule
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_IDS: ${{ secrets.DISCORD_USER_IDS }}
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            python -m anivo.run --schedule "${{ inputs.day }}"
          else
            python -m anivo.run --schedule
          fi
