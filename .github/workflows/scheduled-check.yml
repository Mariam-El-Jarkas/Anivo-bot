name: ANIVO - Scheduled source check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: anivo-database
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ANIVO
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_IDS: ${{ secrets.DISCORD_USER_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXTRA_FEEDS: ${{ secrets.EXTRA_FEEDS }}
          ANIME_TRENDING_FEED: ${{ secrets.ANIME_TRENDING_FEED }}
          ANIVO_RETENTION_DAYS: "7"
        run: python -m anivo.run

      - name: Save ANIVO SQLite memory
        run: |
          cp data/anivo.db /tmp/anivo-local.db
          git fetch origin main:refs/remotes/origin/main
          git reset --hard origin/main
          cp /tmp/anivo-local.db data/anivo.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/anivo.db
          if ! git diff --cached --quiet; then
            git commit -m "Update ANIVO SQLite memory"
            git push origin HEAD:main
          fi
